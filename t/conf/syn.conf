# Fixture for t/syn/*.t, first-SYN drop's suite (VG_FIXTURE=syn
# t/bin/run). As xdp.conf, but wake_pps is low enough for a burst of SYNs
# from unproven addresses on one tick to engage first-SYN drop, and high
# enough that the suite's frames, one at a time, never do; threshold_pps
# low enough that a source counted against itself is blocked.
interface = test0
xdp_mode = skb
wake_pps = 50
wake_mbps = 1000000000
idle_poll_ms = 100
clear_seconds = 86400
threshold_pps = 3
threshold_mbps = 1000000000
metrics_port = 0
remote_map_size = 64
drop_map_size = 64
local_networks = 198.51.100.10/32, 2001:db8::10/128
allow_networks = 169.254.169.254/32, 127.0.0.0/8, ::1/128, fe80::/10, ff02::/16, 192.0.2.99/32
allow_ports = 22
syn_guard = yes
syn_guard_bits = 23
